<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gilbert Mungai - Week 03</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 10px;
        }

        h1 span {
            color: #ff6b35;
        }

        p {
            color: #888;
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #ff6b35;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #e55a27;
        }

        .btn-outline {
            border: 2px solid #ff6b35;
            color: #ff6b35;
        }

        .btn-outline:hover {
            background-color: #ff6b35;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Week 03: <span>Developer Tools & Workflow</span></h1>
        <p>
            This week I mastered the command line and Git version control.
            I practiced terminal navigation, file operations, branching,
            merging, and professional documentation.
        </p>
        <div class="links">
            <a href="https://github.com/dream333wxrld-juice/iyf-s11-week-03-dream333wxrld-juice" class="btn-primary">View Repository</a>
            <a href="https://github.com/dream333wxrld-juice" class="btn-outline">My GitHub</a>
        </div>
    </div>
</body>
</html>
